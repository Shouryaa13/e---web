<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contant</title>
    <link rel="stylesheet" href="index.html">
</head>
<body>
    <!-- ======BOXICONS======= -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .contact {
            padding: 6rem 1rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact__container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
            padding: 0 1rem;
        }

        .contact__info {
            display: grid;
            row-gap: 2rem;
        }

        .contact__card {
            background-color: #fff;
            padding: 1rem;
            border-radius: .75rem;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        .contact__card-icon {
            font-size: 2rem;
            color: #4070f4;
            margin-bottom: .5rem;
        }

        .contact__card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: .5rem;
        }

        .contact__card-data {
            font-size: .875rem;
        }

        .contact__form {
            background-color: #fff;
            padding: 2rem;
            border-radius: .75rem;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        .contact__form-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
        }

        .contact__form-div {
            position: relative;
            margin-bottom: 2rem;
            height: 4rem;
        }

        .contact__form-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #ccc;
            border-radius: .5rem;
            padding: 1.5rem;
            font-size: .938rem;
            outline: none;
            background: none;
            z-index: 1;
        }

        .contact__form-tag {
            position: absolute;
            top: -.75rem;
            left: 1.25rem;
            font-size: .875rem;
            padding: .25rem;
            background-color: #fff;
            z-index: 10;
        }

        .contact__form-area {
            height: 10rem;
        }

        .contact__form-area textarea {
            resize: none;
        }

        .button {
            display: inline-block;
            background-color: #4070f4;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: .5rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            background-color: #3058d6;
        }

        @media screen and (max-width: 768px) {
            .contact__container {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Header section from other pages -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">
                <i class="bx bxs-shopping-bags nav__logo-icon"></i>e-shopper
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="index.html" class="nav__link">Home</a>
                    </li>
                    <li class="nav__item">
                        <a href="shop.html" class="nav__link">Shop</a>
                    </li>
                    <li class="nav__item">
                        <a href="cart.html" class="nav__link">Cart</a>
                    </li>
                    <li class="nav__item">
                        <a href="blog.html" class="nav__link">Blog</a>
                    </li>
                    <li class="nav__item">
                        <a href="faq.html" class="nav__link">FAQ's</a>
                    </li>
                    <li class="nav__item">
                        <a href="contact.html" class="nav__link active-link">Contact</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="contact">
        <div class="contact__container">
            <div class="contact__info">
                <div class="contact__card">
                    <i class='bx bx-mail-send contact__card-icon'></i>
                    <h3 class="contact__card-title">Email</h3>
                    <span class="contact__card-data">info@eshopper.com</span>
                </div>

                <div class="contact__card">
                    <i class='bx bx-phone contact__card-icon'></i>
                    <h3 class="contact__card-title">Phone</h3>
                    <span class="contact__card-data">+1 234 567 8900</span>
                </div>

                <div class="contact__card">
                    <i class='bx bx-map contact__card-icon'></i>
                    <h3 class="contact__card-title">Location</h3>
                    <span class="contact__card-data">123 Shopping Street, NY 10001</span>
                </div>
            </div>

            <div class="contact__form">
                <h3 class="contact__form-title">Contact Us</h3>
                <form action="" method="POST">
                    <div class="contact__form-div">
                        <label class="contact__form-tag">Name</label>
                        <input type="text" class="contact__form-input" placeholder="Enter your name">
                    </div>

                    <div class="contact__form-div">
                        <label class="contact__form-tag">Email</label>
                        <input type="email" class="contact__form-input" placeholder="Enter your email">
                    </div>

                    <div class="contact__form-div contact__form-area">
                        <label class="contact__form-tag">Message</label>
                        <textarea class="contact__form-input" placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit" class="button">Send Message</button>
                </form>
            </div>
        </div>
    </section>
    
</body>
</html>
